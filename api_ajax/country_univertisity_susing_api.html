<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;color:antiquewhite ">
    <h1>enter your country to get college list</h1>
    <input placeholder = "country_name">
    <button >submit</button>
    <ul>
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        let url = "http://universities.hipolabs.com/search?name=";
        const btn = document.querySelector("button");
        const ul = document.querySelector("ul");
        const  input = document.querySelector("input");
        
        async function getColleges(country){
            let response = await axios.get(url+country);
            
            for (let i = 0; i < response.data.length; i++) {    
                let l1 = document.createElement("li");
                l1.textContent = response.data[i].name;
                ul.append(l1);
                console.log(response.data[i].name);
            }
        }
        btn.addEventListener("click",()=>{
            let college = input.value;
           getColleges(college); 
        })


    </script>
</body>
</html>
